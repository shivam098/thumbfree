name: Release Android

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install CMake for the NDK build
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.THUMBFREE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::THUMBFREE_KEYSTORE_B64 is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/thumbfree.p12"
          echo "THUMBFREE_KEYSTORE=$RUNNER_TEMP/thumbfree.p12" >> "$GITHUB_ENV"
          echo "THUMBFREE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
      - name: Build the signed APKs
        working-directory: android
        env:
          THUMBFREE_KEYSTORE_PASSWORD: ${{ secrets.THUMBFREE_KEYSTORE_PASSWORD }}
          THUMBFREE_KEY_ALIAS: ${{ secrets.THUMBFREE_KEY_ALIAS }}
          THUMBFREE_KEY_PASSWORD: ${{ secrets.THUMBFREE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleStandardRelease :app:assembleBubbleRelease -Pthumbfree.abis=arm64-v8a --console=plain
      - name: Check the signatures
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          mkdir dist
          for edition in standard bubble; do
            apk=$(ls android/app/build/outputs/apk/$edition/release/*.apk | head -n1)
            "$tools/apksigner" verify --print-certs "$apk" | tee certs.txt
            if grep -q "CN=Android Debug" certs.txt; then echo "::error::$edition signed with the debug key"; exit 1; fi
            if [ "$edition" = standard ]; then name="ThumbFree-${THUMBFREE_VERSION}.apk"; else name="ThumbFree-${THUMBFREE_VERSION}-with-bubble.apk"; fi
            cp "$apk" "dist/$name"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$THUMBFREE_VERSION" in 0.*|*-*) pre="--prerelease";; esac
          cat > notes.md <<EOF
          **Which APK?**
          - \`ThumbFree-${THUMBFREE_VERSION}.apk\`: install this one. Everything except the bubble.
          - \`ThumbFree-${THUMBFREE_VERSION}-with-bubble.apk\`: adds the floating bubble (dictate with any keyboard). It uses an accessibility service, so Google Play Protect blocks installing it from a browser or file manager in some countries (India). Install it with \`adb install\`, or wait for the Play Store release.

          Both are signed with the same key: you can switch between them without losing your settings or models.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --title "ThumbFree $THUMBFREE_VERSION" --notes-file notes.md --generate-notes $pre
