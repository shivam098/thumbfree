name: Release Android

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.THUMBFREE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::THUMBFREE_KEYSTORE_B64 is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/thumbfree.p12"
          echo "THUMBFREE_KEYSTORE=$RUNNER_TEMP/thumbfree.p12" >> "$GITHUB_ENV"
          echo "THUMBFREE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
      - name: Build the signed APK
        working-directory: android
        env:
          THUMBFREE_KEYSTORE_PASSWORD: ${{ secrets.THUMBFREE_KEYSTORE_PASSWORD }}
          THUMBFREE_KEY_ALIAS: ${{ secrets.THUMBFREE_KEY_ALIAS }}
          THUMBFREE_KEY_PASSWORD: ${{ secrets.THUMBFREE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Pthumbfree.abis=arm64-v8a --console=plain
      - name: Check the signature
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$tools/apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::signed with the debug key"; exit 1; fi
          mkdir dist
          cp "$apk" "dist/ThumbFree-${THUMBFREE_VERSION}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$THUMBFREE_VERSION" in 0.*|*-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "ThumbFree $THUMBFREE_VERSION" --generate-notes $pre
