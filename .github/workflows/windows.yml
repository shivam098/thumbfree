name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", "tests/vectors/**", "tests/audio/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "tests/vectors/**", "tests/audio/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: windows

jobs:
  build-and-test:
    name: Core tests (shared vectors) and x64/ARM64 builds
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests, including tests/vectors
        run: dotnet test tests/ThumbFree.Core.Tests -c Release

      - name: Speech tests (downloads against a local server; engine tests skip without models)
        run: dotnet test tests/ThumbFree.Speech.Tests -c Release

      - name: App tests (settings, History, samples, pages drawn offscreen)
        run: dotnet test tests/ThumbFree.App.Tests -c Release

      - name: Build app (x64)
        run: dotnet build src/ThumbFree.App -c Release -r win-x64

      - name: Build app (ARM64)
        run: dotnet build src/ThumbFree.App -c Release -r win-arm64
