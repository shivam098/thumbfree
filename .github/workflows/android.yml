name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  core:
    name: Core logic (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and formatter vectors
        env:
          THUMBFREE_CORE_ONLY: "1"
        run: ./gradlew :core:test --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-report
          path: android/core/build/reports/tests

  apk:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install CMake for the NDK build
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null
      - name: Use the runner's NDK
        run: echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleStandardDebugAndroidTest :app:assembleBubbleDebugAndroidTest :app:assembleRelease :app:bundleBubbleRelease --console=plain
      - name: Sizes
        run: find app/build/outputs/apk -name '*.apk' -exec ls -l {} +
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: android/app/build/outputs/apk/

  device:
    name: On-device tests (emulator)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the test models
        uses: actions/cache@v4
        with:
          path: models
          key: models-whisper-base.en-a4d4a076-parakeet-110m-1-kroko-en-live-1
      - name: Download the test models
        working-directory: .
        run: |
          mkdir -p models/parakeet-tdt-110m models/kroko-en-live
          get() { [ -f "$2" ] || curl -fsSL --retry 5 -o "$2" "$1"; echo "$3  $2" | sha256sum -c -; }
          get https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q8_0.bin models/ggml-base.en-q8_0.bin a4d4a0768075e13cfd7e19df3ae2dbc4a68d37d36a7dad45e8410c9a34f8c87e
          p=https://github.com/shivam098/thumbfree-android/releases/download/models-parakeet-110m-1
          get $p/encoder.int8.onnx models/parakeet-tdt-110m/encoder.int8.onnx 0f35509ddeb9b39002fb077d979a9fe74f06eb0bc4dd5c34f512f82e5111d657
          get $p/decoder.int8.onnx models/parakeet-tdt-110m/decoder.int8.onnx f7c331c5504c2e593c76ed22b728e3f554af6c4a383dde862e719ced08b1da19
          get $p/joiner.int8.onnx models/parakeet-tdt-110m/joiner.int8.onnx bf7dff69e9f2cdbe9943d70da358f38b361c115ba0105bae7e908e0d6ec782f6
          get $p/tokens.txt models/parakeet-tdt-110m/tokens.txt 450e56bd2f036fe5b6aa821865838cc5aa9d8b0106134ce9a9ba0664abe6cd10
          k=https://github.com/shivam098/thumbfree-android/releases/download/models-kroko-en-live-1
          get $k/encoder.onnx models/kroko-en-live/encoder.onnx d4881c57449d581e0770fd53fa66c2fdc6cd167d92ece7c715e603defc96d9d4
          get $k/decoder.onnx models/kroko-en-live/decoder.onnx 455ba38466fce8d5a57e7db68a323b684079ca4d9e1dd93a740d9b2429aae3b1
          get $k/joiner.onnx models/kroko-en-live/joiner.onnx d406f616736350e2a7df3e39398b78eb2fc1a2ca6973a19d3853fa3227e25b52
          get $k/tokens.txt models/kroko-en-live/tokens.txt 396dbeb5f4858875690716084f54e90d339679d0ba3e6b5b584f3d7589254d2d
          get $k/punct.int8.onnx models/kroko-en-live/punct.int8.onnx 9d611f445fe4a46186080fe161be6059d87d72eb88d3a8cb00c1a06e83a6067e
          get $k/punct-bpe.vocab models/kroko-en-live/punct-bpe.vocab e118b7ad88c54db562517df49e1cffd4836d166c34fb190fd311d7f34eb238f5
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: .
          script: bash scripts/android-device-test.sh apks models
