name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  core:
    name: Core logic (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and formatter vectors
        env:
          THUMBFREE_CORE_ONLY: "1"
        run: ./gradlew :core:test --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-report
          path: android/core/build/reports/tests

  apk:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install CMake for the NDK build
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null
      - name: Use the runner's NDK
        run: echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --console=plain
      - name: Sizes
        run: ls -l app/build/outputs/apk/*/*.apk app/build/outputs/apk/androidTest/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  device:
    name: On-device tests (emulator)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the test models
        uses: actions/cache@v4
        with:
          path: models
          key: models-whisper-base.en-a4d4a076-parakeet-110m-1
      - name: Download the test models
        working-directory: .
        run: |
          mkdir -p models/parakeet-tdt-110m
          get() { [ -f "$2" ] || curl -fsSL --retry 5 -o "$2" "$1"; echo "$3  $2" | sha256sum -c -; }
          get https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q8_0.bin models/ggml-base.en-q8_0.bin a4d4a0768075e13cfd7e19df3ae2dbc4a68d37d36a7dad45e8410c9a34f8c87e
          p=https://github.com/shivam098/thumbfree/releases/download/models-parakeet-110m-1
          get $p/encoder.int8.onnx models/parakeet-tdt-110m/encoder.int8.onnx 0f35509ddeb9b39002fb077d979a9fe74f06eb0bc4dd5c34f512f82e5111d657
          get $p/decoder.int8.onnx models/parakeet-tdt-110m/decoder.int8.onnx f7c331c5504c2e593c76ed22b728e3f554af6c4a383dde862e719ced08b1da19
          get $p/joiner.int8.onnx models/parakeet-tdt-110m/joiner.int8.onnx bf7dff69e9f2cdbe9943d70da358f38b361c115ba0105bae7e908e0d6ec782f6
          get $p/tokens.txt models/parakeet-tdt-110m/tokens.txt 450e56bd2f036fe5b6aa821865838cc5aa9d8b0106134ce9a9ba0664abe6cd10
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: .
          script: bash scripts/android-device-test.sh apks models
