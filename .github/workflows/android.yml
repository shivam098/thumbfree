name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  core:
    name: Core logic (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and formatter vectors
        env:
          THUMBFREE_CORE_ONLY: "1"
        run: ./gradlew :core:test --console=plain
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-report
          path: android/core/build/reports/tests

  apk:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install CMake for the NDK build
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null
      - name: Use the runner's NDK
        run: echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --console=plain
      - name: Sizes
        run: ls -l app/build/outputs/apk/*/*.apk app/build/outputs/apk/androidTest/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  device:
    name: On-device tests (emulator)
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the English model
        uses: actions/cache@v4
        with:
          path: models
          key: ggml-base.en-q8_0-a4d4a076
      - name: Download the English model
        working-directory: .
        run: |
          mkdir -p models
          f=models/ggml-base.en-q8_0.bin
          [ -f "$f" ] || curl -fsSL --retry 5 -o "$f" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q8_0.bin
          echo "a4d4a0768075e13cfd7e19df3ae2dbc4a68d37d36a7dad45e8410c9a34f8c87e  $f" | sha256sum -c -
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: .
          script: bash scripts/android-device-test.sh apks models/ggml-base.en-q8_0.bin
