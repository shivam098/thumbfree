name: Release

# One product version, one GitHub release, files for every platform (docs/PLAN.md 6). Each platform builds in its own
# job; the release is created once, at the end, with all of them and one SHA256SUMS.txt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: Android APKs and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install CMake for the NDK build
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.THUMBFREE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::THUMBFREE_KEYSTORE_B64 is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/thumbfree.p12"
          echo "THUMBFREE_KEYSTORE=$RUNNER_TEMP/thumbfree.p12" >> "$GITHUB_ENV"
          echo "THUMBFREE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
      - name: Build the signed APKs
        working-directory: android
        env:
          THUMBFREE_KEYSTORE_PASSWORD: ${{ secrets.THUMBFREE_KEYSTORE_PASSWORD }}
          THUMBFREE_KEY_ALIAS: ${{ secrets.THUMBFREE_KEY_ALIAS }}
          THUMBFREE_KEY_PASSWORD: ${{ secrets.THUMBFREE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleStandardRelease :app:assembleBubbleRelease -Pthumbfree.abis=arm64-v8a --console=plain
          # Google Play takes an app bundle; it ships each phone only its own ABI, so include the emulator/Chromebook one too.
          ./gradlew :app:bundleBubbleRelease --console=plain
      - name: Check the signatures
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          mkdir dist
          for edition in standard bubble; do
            apk=$(ls android/app/build/outputs/apk/$edition/release/*.apk | head -n1)
            "$tools/apksigner" verify --print-certs "$apk" | tee certs.txt
            if grep -q "CN=Android Debug" certs.txt; then echo "::error::$edition signed with the debug key"; exit 1; fi
            if [ "$edition" = standard ]; then name="ThumbFree-${THUMBFREE_VERSION}.apk"; else name="ThumbFree-${THUMBFREE_VERSION}-with-bubble.apk"; fi
            cp "$apk" "dist/$name"
          done
          aab=$(ls android/app/build/outputs/bundle/bubbleRelease/*.aab | head -n1)
          keytool -printcert -jarfile "$aab" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::the app bundle is signed with the debug key"; exit 1; fi
          cp "$aab" "dist/ThumbFree-${THUMBFREE_VERSION}-google-play.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    name: Windows zips (x64 and ARM64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: The app's version matches the tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = ([xml](Get-Content windows/src/ThumbFree.App/ThumbFree.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -ne $tag) { Write-Error "ThumbFree.App.csproj says $version but the tag is $tag"; exit 1 }
      - name: Tests
        run: dotnet test windows/ThumbFree.slnx -c Release
      - name: Package (with the Visual C++ runtime)
        shell: pwsh
        run: ./windows/scripts/package.ps1 -RequireVcRuntime
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/dist/*.zip

  publish:
    name: GitHub release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          pre=""
          case "$version" in 0.*|*-*) pre="--prerelease";; esac
          cat > notes.md <<EOF
          **Windows:** \`ThumbFree-${version}-win-x64.zip\` for Intel and AMD PCs, \`ThumbFree-${version}-win-arm64.zip\` for Snapdragon and other ARM PCs. Unzip, run \`ThumbFree.exe\`, then tap Ctrl+Win to dictate.

          **Android, which APK?**
          - \`ThumbFree-${version}.apk\`: install this one. Everything except the bubble.
          - \`ThumbFree-${version}-with-bubble.apk\`: adds the floating bubble (dictate with any keyboard). It uses an accessibility service, so Google Play Protect blocks installing it from a browser or file manager in some countries (India). Install it with \`adb install\`, or wait for the Play Store release.
          - \`ThumbFree-${version}-google-play.aab\`: the bubble edition as an app bundle, for uploading to Google Play (not for installing).

          Both APKs are signed with the same key: you can switch between them without losing your settings or models.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "ThumbFree $version" --notes-file notes.md --generate-notes $pre
